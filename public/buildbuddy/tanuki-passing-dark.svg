<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 360 360" role="img" aria-labelledby="title desc" data-character="tanuki" data-mood="happy" data-theme="dark"><title id="title">BuildBuddy: passing build</title><desc id="desc">happy tanuki. All systems smiling</desc><defs><radialGradient id="halo"><stop stop-color="#a5b4fc" stop-opacity=".2"/><stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/></radialGradient></defs><style>
